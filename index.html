<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids School</title>

    <!-- Fav Icon -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- Css Files -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>
    <!-- Header part -->
    <header class="header">
        <div class="container">
            <nav class="navbar flex justify-between items-center">

                <!-- Logo -->
                <a href="#" class="nav-logo flex items-center">
                    <img src="./assets/logo.png" alt="Kids School Logo">
                    <span>SCHOOL</span>
                </a>

                <!-- Nav Items -->
                <ul class="nav-menu flex items-center">
                    <li>
                        <a href="#" class="nav-link orange">Home</a>
                    </li>

                    <li>
                        <a href="#" class="nav-link sky-blue">About</a>
                    </li>

                    <li>
                        <a href="#" class="nav-link cyan">Facilities</a>
                    </li>

                    <li>
                        <a href="#" class="nav-link indigo">Admission</a>
                    </li>
                </ul>

                <!-- Contact Button -->
                <button class="btn orange-bg nav-btn">
                    Contact
                </button>

                <!-- Mobile Menu Icon -->
                <div class="menu-btn">
                    <img src="./assets/menu.png" alt="menu icon">
                </div>

            </nav>
        </div>
    </header>

    <!-- Main Part -->
    <main>
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="container">
                <div class="hero-content flex items-center justify-between">

                    <!-- Left Content -->
                    <div class="hero-text">

                        <h1 class="hero-title">
                            <span class="orange">Empowering</span><br>
                            students from small age
                            <span class="sky-blue">towards vision</span>
                        </h1>

                        <p class="hero-description">
                            With the courage, Confidence, Creativity and Compassion
                            to make their Unique Contribution in a Diverse and Dynamic World.
                        </p>

                        <button class="btn black-bg hero-btn">
                            Enroll Now
                        </button>

                    </div>

                    <!-- Right Image -->
                    <div class="hero-image">
                        <img src="./assets/hero-kids.png" alt="Kids School Students">
                    </div>

                </div>
            </div>
        </section>
    </main>

    <!-- Footer Part -->
    <footer>

    </footer>
</body>

</html>
